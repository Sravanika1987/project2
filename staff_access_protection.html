<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricted Access - Hospital Management System</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .bg-image {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-image: url('images/hi1.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(3px) brightness(1.2);
            z-index: -2;
        }

        .overlay {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 20, 40, 0.7);
            z-index: -1;
        }

        .protection-container {
            width: 90%;
            max-width: 500px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .warning-icon {
            font-size: 4em;
            margin-bottom: 20px;
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        .warning-title {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .warning-message {
            font-size: 1.3em;
            margin-bottom: 30px;
            color: #e0e0e0;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .password-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            text-align: center;
            transition: all 0.3s ease;
        }

        .password-input:focus {
            outline: none;
            border-color: #00e6e6;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 230, 230, 0.3);
        }

        .password-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .enter-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00b3b3, #00e6e6);
            color: #000;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 230, 230, 0.3);
        }

        .enter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 230, 230, 0.5);
        }

        .enter-btn:active {
            transform: translateY(0);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #00e6e6;
            text-decoration: none;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #fff;
            text-shadow: 0 0 10px #00e6e6;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 1em;
            margin-top: 15px;
            display: none;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        @media (max-width: 480px) {
            .protection-container {
                padding: 30px 20px;
            }
            .warning-title {
                font-size: 2em;
            }
            .warning-message {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div class="protection-container">
        <div class="warning-icon">🔒</div>
        <h1 class="warning-title">Restricted Access</h1>
        <p class="warning-message">Authorized Hospital Members Only</p>
        
        <div class="input-group">
            <input type="password" id="accessPassword" class="password-input" placeholder="Enter Staff Access Password">
        </div>
        
        <button class="enter-btn" onclick="verifyAccess()">Enter</button>
        
        <p class="error-message" id="errorMessage">Incorrect password. Access denied.</p>
        
        <a href="index.html" class="back-link">← Back to Homepage</a>
    </div>

    <script>
        // Check if already authenticated
        if (sessionStorage.getItem('staffAuthenticated') === 'true') {
            window.location.href = 'staff_login.html';
        }

        // Allow Enter key to submit
        document.getElementById('accessPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyAccess();
            }
        });

        function verifyAccess() {
            const password = document.getElementById('accessPassword').value;
            const storedPassword = localStorage.getItem('staffAccessPassword') || 'staff';
            
            if (password === storedPassword) {
                // Set session authentication
                sessionStorage.setItem('staffAuthenticated', 'true');
                // Redirect to staff login page
                window.location.href = 'staff_login.html';
            } else {
                // Show error message
                const errorMsg = document.getElementById('errorMessage');
                errorMsg.style.display = 'block';
                document.getElementById('accessPassword').value = '';
                document.getElementById('accessPassword').focus();
                
                // Hide error after 3 seconds
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 3000);
            }
        }
    </script>

</body>
</html>
