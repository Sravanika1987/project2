<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin_dashboard.css">
</head>
<body>

    <header class="top-header">
        <a href="index.html" class="dashboard-link">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="#" class="dashboard-link">
            <i class="fas fa-phone"></i>
            <span>Help</span>
        </a>
        <a href="view_doctors.html" class="dashboard-link">
            <i class="fas fa-user-md"></i>
            <span>View Doctors</span>
        </a>
        <a href="view_staff.html" class="dashboard-link">
            <i class="fas fa-users"></i>
            <span>View Staff</span>
        </a>
        <a href="previous_patients.html" class="dashboard-link" style="margin-left: auto;">
            <i class="fas fa-history"></i>
            <span>Previous Patients</span>
        </a>
        <a href="#" class="dashboard-link">
            <i class="fas fa-sync-alt"></i>
            <span>Reset</span>
        </a>
    </header>

    <div class="bg-image"></div>
    <div class="overlay"></div>

    <h1 class="glowing-heading top-heading">Welcome Admin!</h1>

    <div class="main-container">
        <div class="dashboard-options">
            <div class="glass-card">
                <a href="add_doctor.html" class="card-link-content">
                    <img src="images/d1.jpg" alt="Add Doctors" class="card-image">
                    <span class="card-option-text">Add Doctors</span>
                </a>
            </div>
            <div class="glass-card">
                <a href="add_staff.html" class="card-link-content">
                    <img src="images/st1.jpg" alt="Add Staff" class="card-image">
                    <span class="card-option-text">Add Staff</span>
                </a>
            </div>
            <div class="glass-card">
                <a href="view_workloads.html" class="card-link-content">
                    <img src="images/p2.webp" alt="View Workloads" class="card-image">
                    <span class="card-option-text">View Workloads</span>
                </a>
            </div>
            <div class="glass-card">
                <a href="view_patients_admin.html" class="card-link-content">
                    <img src="images/patient 3.jpeg" alt="View Patients" class="card-image">
                    <span class="card-option-text">View Patients</span>
                </a>
            </div>
            <div class="glass-card">
                <a href="#" class="card-link-content" onclick="openPasswordManagement(event)">
                    <img src="images/admin 1.jpg" alt="Manage Password" class="card-image">
                    <span class="card-option-text">Manage Staff Access Password</span>
                </a>
            </div>
            <div class="glass-card">
                <a href="#" class="card-link-content">
                    <img src="images/log1.jpg" alt="Logout" class="card-image">
                    <span class="card-option-text logout">Logout</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Password Management Popup -->
    <div id="passwordPopup" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 9999; justify-content: center; align-items: center;">
        <div style="width: 90%; max-width: 500px; padding: 40px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); border-radius: 20px; border: 2px solid rgba(255, 255, 255, 0.3); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);">
            <h2 style="color: #fff; text-align: center; margin-bottom: 30px; font-size: 2em;">Manage Staff Access Password</h2>
            <div style="margin-bottom: 20px;">
                <label style="color: #fff; display: block; margin-bottom: 10px; font-size: 1.1em;">Current Password:</label>
                <input type="text" id="currentPassword" readonly style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.15); color: #fff; font-size: 1em;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="color: #fff; display: block; margin-bottom: 10px; font-size: 1.1em;">New Password:</label>
                <input type="text" id="newPassword" placeholder="Enter new password" style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.15); color: #fff; font-size: 1em;">
            </div>
            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button onclick="savePassword()" style="flex: 1; padding: 15px; border: none; border-radius: 10px; background: linear-gradient(135deg, #00b3b3, #00e6e6); color: #000; font-size: 1.1em; font-weight: 600; cursor: pointer;">Save Password</button>
                <button onclick="closePasswordPopup()" style="flex: 1; padding: 15px; border: none; border-radius: 10px; background: rgba(255, 255, 255, 0.2); color: #fff; font-size: 1.1em; font-weight: 600; cursor: pointer;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check login status
            const isAdminLoggedIn = localStorage.getItem('isAdminLoggedIn');
            if (isAdminLoggedIn !== 'true') {
                window.location.href = 'admin_login.html';
                return;
            }

            // Initialize default password if not set
            if (!localStorage.getItem('staffAccessPassword')) {
                localStorage.setItem('staffAccessPassword', 'staff');
            }

            // Logout functionality
            const logoutCard = document.querySelector('.glass-card a[href="#"][alt="Logout"]');
            if (logoutCard) {
                logoutCard.addEventListener('click', function(event) {
                    event.preventDefault();
                    localStorage.removeItem('isAdminLoggedIn');
                    sessionStorage.removeItem('staffAuthenticated');
                    window.location.href = 'admin_login.html';
                });
            }
        });

        function openPasswordManagement(event) {
            event.preventDefault();
            const currentPassword = localStorage.getItem('staffAccessPassword') || 'staff';
            document.getElementById('currentPassword').value = currentPassword;
            document.getElementById('newPassword').value = '';
            document.getElementById('passwordPopup').style.display = 'flex';
        }

        function closePasswordPopup() {
            document.getElementById('passwordPopup').style.display = 'none';
        }

        function savePassword() {
            const newPassword = document.getElementById('newPassword').value.trim();
            if (!newPassword) {
                alert('Please enter a new password');
                return;
            }
            
            // Save new password
            localStorage.setItem('staffAccessPassword', newPassword);
            
            // Set notification for staff
            localStorage.setItem('passwordUpdatedNotification', 'true');
            localStorage.setItem('passwordUpdateTime', new Date().toISOString());
            
            alert('Staff Access Password Updated Successfully!\nAll staff members will be notified.');
            closePasswordPopup();
        }
    </script>

</body>
</html>
